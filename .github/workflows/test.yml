name: UI Tests

on:
  push:
    branches: [main, master, unitTest]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Jest tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Jest tests with coverage
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=cobertura
      - name: Create coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/cobertura-coverage.xml
          badge: true
          format: markdown
          output: both
          fail_below_min: true
          thresholds: '95 95'
      - name: Add coverage to workflow summary
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate coverage badge data
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'unitTest')
        run: |
          node -e "const fs=require('fs'); const xml=fs.readFileSync('coverage/cobertura-coverage.xml','utf8'); const match=xml.match(/<coverage[^>]*line-rate=\"([0-9.]+)\"/); if (!match) throw new Error('Coverage line-rate was not found'); const value=(Number(match[1])*100).toFixed(2).replace(/\\.00$/, ''); const color=Number(value)>=95?'brightgreen':Number(value)>=80?'yellow':'red'; fs.writeFileSync('coverage-badge.json', JSON.stringify({schemaVersion:1,label:'coverage',message:value+'%',color}));"
      - name: Commit coverage badge on main branch
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'unitTest')
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coverage-badge.json
          git diff --cached --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push
      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ui-coverage
          path: code-coverage-results.md
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage-${{ github.sha }}
          path: coverage
